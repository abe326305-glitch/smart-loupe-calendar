<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>スマート拡大鏡＆辞書・カレンダーログ</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Tesseract.js (OCR文字認識) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #151d2f;
      --accent: #38bdf8;
      --accent-gold: #facc15;
      --accent-green: #22c55e;
      --accent-purple: #c084fc;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 上部ヘッダー */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      padding-top: max(8px, env(safe-area-inset-top));
      background: rgba(15, 23, 42, 0.98);
      border-bottom: 1px solid var(--border-color);
      z-index: 50;
      overflow-x: auto;
      white-space: nowrap;
    }

    .app-title {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-gold);
      margin-right: 8px;
      flex-shrink: 0;
    }

    .header-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .header-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: #1e293b;
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .badge-count {
      background: var(--accent-red);
      color: white;
      font-size: 0.65rem;
      padding: 1px 5px;
      border-radius: 10px;
      font-weight: bold;
    }

    /* メインコンテンツ表示域 */
    .view-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .view-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
    }

    .view-panel.active {
      display: flex;
    }

    /* --------------------------------------
       1. 拡大鏡ビュー (Camera / Loupe)
       -------------------------------------- */
    .loupe-view {
      position: relative;
      background: #000;
      justify-content: space-between;
    }

    .camera-viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #videoElement {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
      transition: transform 0.05s ease-out, filter 0.2s ease;
    }

    #freezeCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 10;
    }

    /* 照準 */
    .reticle {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 1.5px dashed rgba(250, 204, 21, 0.4);
      border-radius: 50%;
      pointer-events: none;
      z-index: 15;
    }
    .reticle::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: rgba(250, 204, 21, 0.7);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .zoom-overlay-tag {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      z-index: 20;
      backdrop-filter: blur(4px);
    }

    .freeze-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: var(--accent-red);
      color: white;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      display: none;
      z-index: 20;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* 拡大鏡の下部コントロールバー */
    .loupe-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(to top, rgba(9, 13, 22, 0.98) 60%, rgba(9, 13, 22, 0.75) 90%, transparent);
      padding: 10px 14px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ズームスライダー行 */
    .zoom-slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(30, 41, 59, 0.85);
      padding: 6px 12px;
      border-radius: 30px;
      border: 1px solid var(--border-color);
      backdrop-filter: blur(6px);
    }

    .slider-icon {
      color: var(--accent-gold);
      font-size: 0.85rem;
    }

    .zoom-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: #475569;
      border-radius: 3px;
      outline: none;
    }

    .zoom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent-gold);
      cursor: pointer;
      box-shadow: 0 0 8px rgba(250, 204, 21, 0.8);
    }

    .preset-zooms {
      display: flex;
      gap: 4px;
    }

    .preset-btn {
      background: #0f172a;
      border: 1px solid #475569;
      color: #cbd5e1;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 6px;
      border-radius: 12px;
      cursor: pointer;
    }

    .preset-btn.active {
      background: var(--accent-gold);
      color: #0f172a;
      border-color: var(--accent-gold);
    }

    /* ツールボタン行 */
    .action-buttons-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 4px;
    }

    .sub-action-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sub-action-btn.active {
      background: var(--accent-gold);
      color: #0f172a;
      border-color: var(--accent-gold);
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.5);
    }

    .sub-btn-label {
      font-size: 0.52rem;
      font-weight: 600;
      margin-top: 1px;
    }

    /* メインシャッター（撮影ボタン） */
    .shutter-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: white;
      border: 4px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
      transition: transform 0.1s;
    }

    .shutter-btn:active {
      transform: scale(0.92);
    }

    /* --------------------------------------
       2. カレンダーログ画面
       -------------------------------------- */
    .calendar-log-view, .gallery-view, .dictionary-view {
      overflow-y: auto;
      padding: 14px;
      padding-bottom: 90px;
      background: var(--bg-dark);
      flex: 1;
    }

    .section-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .log-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .log-card.status-registered {
      border-color: rgba(34, 197, 94, 0.5);
    }

    .log-card-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .log-thumb {
      width: 66px;
      height: 66px;
      border-radius: 8px;
      object-fit: cover;
      background: #0f172a;
      border: 1px solid var(--border-color);
      cursor: pointer;
      flex-shrink: 0;
    }

    .log-info {
      flex: 1;
      overflow: hidden;
    }

    .log-date-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(250, 204, 21, 0.15);
      border: 1px solid rgba(250, 204, 21, 0.4);
      color: var(--accent-gold);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      margin-bottom: 4px;
    }

    .log-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 3px;
      word-break: break-all;
    }

    .log-memo {
      font-size: 0.8rem;
      color: var(--text-sub);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .log-card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      border-top: 1px solid rgba(51, 65, 85, 0.5);
      padding-top: 8px;
    }

    .cal-add-btn {
      flex: 1;
      min-width: 120px;
      background: #1e3a8a;
      border: 1px solid #3b82f6;
      color: white;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
    }

    .cal-ics-btn {
      flex: 1;
      min-width: 120px;
      background: #134e4a;
      border: 1px solid #14b8a6;
      color: white;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
    }

    .log-sub-actions {
      display: flex;
      gap: 5px;
      margin-left: auto;
    }

    .card-icon-btn {
      background: #1e293b;
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .card-icon-btn.delete { color: var(--accent-red); }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-sub);
    }
    .empty-icon {
      font-size: 2.8rem;
      color: #334155;
      margin-bottom: 10px;
    }

    /* --------------------------------------
       3. 翻訳・漢字・言葉の意味 画面
       -------------------------------------- */
    .smart-tools-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tool-input-row {
      display: flex;
      gap: 8px;
    }

    .tool-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: white;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      user-select: text;
    }

    .tool-action-btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }

    .tool-btn {
      padding: 10px 6px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .tool-btn.translate {
      background: #1e3a8a;
      border-color: #3b82f6;
      color: #93c5fd;
    }
    .tool-btn.kanji {
      background: #701a75;
      border-color: #c084fc;
      color: #f5d0fe;
    }
    .tool-btn.meaning {
      background: #14532d;
      border-color: #22c55e;
      color: #bbf7d0;
    }

    /* 知的解説結果カード */
    .knowledge-result-card {
      background: #0f172a;
      border: 1.5px solid var(--accent);
      border-radius: 12px;
      padding: 14px;
      display: none;
      flex-direction: column;
      gap: 10px;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .result-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 6px;
      width: fit-content;
    }

    .result-badge.blue { background: #1e3a8a; color: #93c5fd; border: 1px solid #3b82f6; }
    .result-badge.purple { background: #581c87; color: #f5d0fe; border: 1px solid #c084fc; }
    .result-badge.green { background: #14532d; color: #bbf7d0; border: 1px solid #22c55e; }

    .result-main-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: white;
      line-height: 1.4;
      user-select: text;
    }

    .result-sub-text {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.5;
      user-select: text;
      background: rgba(30, 41, 59, 0.6);
      padding: 10px;
      border-radius: 8px;
      border-left: 3px solid var(--accent-gold);
    }

    .voice-read-btn {
      background: #334155;
      border: 1px solid #64748b;
      color: white;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
    }

    /* --------------------------------------
       4. 撮影後モーダル / メモ・カレンダー・知性ツール
       -------------------------------------- */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-sheet {
      background: var(--card-bg);
      border-top: 2px solid var(--accent);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.25s ease-out;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .sheet-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sheet-close {
      background: #1e293b;
      border: none;
      color: var(--text-sub);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
    }

    .sheet-body {
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .captured-preview-box {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      max-height: 150px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-color);
    }

    #capturedImagePreview {
      max-width: 100%;
      max-height: 150px;
      object-fit: contain;
    }

    /* クイック知的ツール行（撮影画面内） */
    .quick-intellect-bar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      background: rgba(15, 23, 42, 0.7);
      padding: 8px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .intellect-btn {
      background: #1e293b;
      border: 1px solid #475569;
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 7px 4px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .intellect-btn.trans { border-color: #3b82f6; color: #93c5fd; }
    .intellect-btn.kanji { border-color: #c084fc; color: #f5d0fe; }
    .intellect-btn.dict { border-color: #22c55e; color: #bbf7d0; }

    /* モーダル内知的解説ボックス */
    .modal-intellect-result {
      background: #090d16;
      border: 1.5px solid var(--accent-gold);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.85rem;
      color: #f8fafc;
      display: none;
      user-select: text;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-input, .form-textarea {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: white;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.92rem;
      outline: none;
      user-select: text;
    }

    .datetime-row {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 8px;
    }

    .detected-badge-tag {
      font-size: 0.7rem;
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.5);
      color: #4ade80;
      padding: 1px 5px;
      border-radius: 4px;
    }

    /* モーダル下部保存ボタン群 */
    .sheet-footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-save-log {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border: 1px solid var(--accent);
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 11px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }

    .quick-cal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    /* 通知トースト */
    .toast {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent);
      color: white;
      padding: 9px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
      z-index: 200;
    }
    .toast.show {

  <!-- 通知トースト -->

    <i class="fa-solid fa-circle-check" style="color:var(--accent-green);"></i>
    <span id="toastMsg">保存しました</span>
  </div>

  <script>
    /* ========================================================
       スマート拡大鏡＆辞書・カレンダーログ ロジック
       ======================================================== */
    let currentStream = null;
    let videoTrack = null;
    let currentZoom = 1.0;
    let maxHardwareZoom = 1.0;
    let isFrozen = false;
    let isTorchOn = false;
    let currentFilterIdx = 0;
    const filterModes = [
      { name: "標準", filter: "none" },
      { name: "高コントラスト", filter: "contrast(180%) brightness(110%)" },
      { name: "白黒反転", filter: "invert(100%) contrast(150%)" },
      { name: "グレースケール", filter: "grayscale(100%) contrast(150%)" },
      { name: "黄色文字(弱視配慮)", filter: "sepia(100%) hue-rotate(15deg) contrast(180%)" }
    ];

    let capturedDataUrl = null;
    let currentVoiceText = "";
    let currentVoiceLang = "ja-JP";
    let db = null;

    // 1. IndexedDBの初期化
    const DB_NAME = "SmartLoupeDB";
    const DB_VERSION = 1;

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains("logs")) {
            const store = d.createObjectStore("logs", { keyPath: "id", autoIncrement: true });
            store.createIndex("date", "date", { unique: false });
            store.createIndex("createdAt", "createdAt", { unique: false });
          }
        };
        req.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        req.onerror = (e) => reject(e);
      });
    }

    // 2. カメラ起動
    async function startCamera() {
      const video = document.getElementById("videoElement");
      try {
        const constraints = {
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        currentStream = stream;
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];

        const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (capabilities.zoom) {
          maxHardwareZoom = capabilities.zoom.max || 1.0;
          document.getElementById("zoomSlider").max = Math.max(10, maxHardwareZoom);
        }
      } catch (err) {
        console.warn("カメラ起動注意:", err);
      }
    }

    // 3. ズーム制御
    function applyZoom(val) {
      currentZoom = parseFloat(val);
      document.getElementById("zoomBadge").innerText = `${currentZoom.toFixed(1)}x`;
      document.getElementById("zoomSlider").value = currentZoom;

      document.querySelectorAll(".preset-btn").forEach(btn => {
        const p = parseFloat(btn.innerText);
        btn.classList.toggle("active", Math.abs(p - currentZoom) < 0.2);
      });

      if (videoTrack && videoTrack.applyConstraints) {
        const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (capabilities.zoom) {
          const hwVal = Math.min(currentZoom, capabilities.zoom.max || 1.0);
          videoTrack.applyConstraints({ advanced: [{ zoom: hwVal }] }).catch(() => {});
          const cssZoom = currentZoom / hwVal;
          document.getElementById("videoElement").style.transform = `scale(${cssZoom})`;
          return;
        }
      }
      document.getElementById("videoElement").style.transform = `scale(${currentZoom})`;
    }

    function setZoom(val) { applyZoom(val); }

    document.getElementById("zoomSlider").addEventListener("input", (e) => {
      applyZoom(e.target.value);
    });

    // ピンチ操作
    let touchStartDist = 0;
    let initialZoomOnTouch = 1.0;
    const viewport = document.getElementById("viewport");
    viewport.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        touchStartDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
        initialZoomOnTouch = currentZoom;
      }
    }, { passive: true });

    viewport.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2 && touchStartDist > 0) {
        const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
        const factor = dist / touchStartDist;
        applyZoom(Math.min(10, Math.max(1, initialZoomOnTouch * factor)));
      }
    }, { passive: true });

    // ライト (トーチ)
    async function toggleTorch() {
      if (!videoTrack || !videoTrack.applyConstraints) {
        showToast("この端末ではライト制御に対応していません");
        return;
      }
      try {
        isTorchOn = !isTorchOn;
        await videoTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
        document.getElementById("btnTorch").classList.toggle("active", isTorchOn);
        showToast(isTorchOn ? "ライト点灯" : "ライト消灯");
      } catch (e) {
        showToast("ライトの点灯に対応していません");
      }
    }

    // 静止 (フリーズ)
    function toggleFreeze() {
      const video = document.getElementById("videoElement");
      const canvas = document.getElementById("freezeCanvas");
      const badge = document.getElementById("freezeBadge");
      const btn = document.getElementById("btnFreeze");

      if (!isFrozen) {
        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.style.transform = video.style.transform;
        canvas.style.filter = video.style.filter;
        canvas.style.display = "block";
        video.style.visibility = "hidden";
        isFrozen = true;
        badge.style.display = "block";
        btn.classList.add("active");
        showToast("静止しました (手ブレなしで確認できます)");
      } else {
        canvas.style.display = "none";
        video.style.visibility = "visible";
        isFrozen = false;
        badge.style.display = "none";
        btn.classList.remove("active");
      }
    }

    // フィルター切替
    function cycleFilter() {
      currentFilterIdx = (currentFilterIdx + 1) % filterModes.length;
      const mode = filterModes[currentFilterIdx];
      const video = document.getElementById("videoElement");
      const canvas = document.getElementById("freezeCanvas");
      video.style.filter = mode.filter;
      canvas.style.filter = mode.filter;
      document.getElementById("filterLabel").innerText = mode.name;
      document.getElementById("btnFilter").classList.toggle("active", currentFilterIdx !== 0);
      showToast(`フィルター: ${mode.name}`);
    }

    // 撮影
    function captureCurrentFrame() {
      const video = document.getElementById("videoElement");
      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext("2d");

      if (isFrozen) {
        const freezeCanvas = document.getElementById("freezeCanvas");
        ctx.drawImage(freezeCanvas, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      }
      return canvas.toDataURL("image/jpeg", 0.9);
    }

    function captureAndOpenSheet() {
      capturedDataUrl = captureCurrentFrame();
      openEditSheet(capturedDataUrl);
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        capturedDataUrl = evt.target.result;
        openEditSheet(capturedDataUrl);
      };
      reader.readAsDataURL(file);
    }

    function openEditSheet(imgUrl) {
      document.getElementById("capturedImagePreview").src = imgUrl;
      const now = new Date();
      const todayStr = now.toISOString().split("T")[0];
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      document.getElementById("editTitle").value = "";
      document.getElementById("editDate").value = todayStr;
      document.getElementById("editTime").value = timeStr;
      document.getElementById("editMemo").value = "";
      document.getElementById("dateDetectedTag").style.display = "none";
      document.getElementById("timeDetectedTag").style.display = "none";
      document.getElementById("modalIntellectResult").style.display = "none";

      document.getElementById("editSheet").classList.add("active");
      runOcrScan();
    }

    function closeEditSheet() {
      document.getElementById("editSheet").classList.remove("active");
    }

    // OCR文字認識 ＆ 日時自動抽出
    async function runOcrScan() {
      const btn = document.getElementById("btnRunOcrModal");
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 解析中...`;

      try {
        let text = "";
        if (window.Tesseract) {
          const result = await Tesseract.recognize(
            capturedDataUrl,
            'jpn+eng',
            { logger: m => console.log(m) }
          );
          text = result.data.text || "";
        }

        if (text) {
          document.getElementById("editMemo").value = text.trim();
          extractDateTimeFromText(text);
          // 辞書タブの検索入力にも自動同期
          document.getElementById("dictQueryInput").value = text.trim().substring(0, 50);
          showToast("文字と日時を認識しました！");
        }
      } catch (err) {
        console.warn("OCR実行エラー:", err);
      } finally {
        btn.innerHTML = `<i class="fa-solid fa-arrows-rotate"></i> 再スキャン`;
      }
    }

    function extractDateTimeFromText(text) {
      const now = new Date();
      let detectedDate = null;
      let detectedTime = null;

      const ymdRegex = /(?:(\d{4}|令(?:和)?\s*(\d{1,2}))[年\/\.\-])?\s*(\d{1,2})[月\/\.\-](\d{1,2})日?/;
      const matchYmd = text.match(ymdRegex);
      if (matchYmd) {
        let year = now.getFullYear();
        if (matchYmd[1]) {
          if (matchYmd[1].startsWith("令")) {
            const rYear = parseInt(matchYmd[2] || "1", 10);
            year = 2018 + rYear;
          } else {
            year = parseInt(matchYmd[1], 10);
          }
        }
        const month = parseInt(matchYmd[3], 10);
        const day = parseInt(matchYmd[4], 10);
        if (month >= 1 && month <= 12 && day >= 1 && day <= 31) {
          detectedDate = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        }
      }

      const timeRegex = /(?:(午前|午後)\s*)?(\d{1,2})[:時](\d{2})?(?:分)?/;
      const matchTime = text.match(timeRegex);
      if (matchTime) {
        let hour = parseInt(matchTime[2], 10);
        const minute = matchTime[3] ? parseInt(matchTime[3], 10) : 0;
        const ampm = matchTime[1];
        if (ampm === "午後" && hour < 12) hour += 12;
        if (ampm === "午前" && hour === 12) hour = 0;
        if (hour >= 0 && hour <= 23 && minute >= 0 && minute <= 59) {
          detectedTime = `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
        }
      }

      if (detectedDate) {
        document.getElementById("editDate").value = detectedDate;
        document.getElementById("dateDetectedTag").style.display = "inline";
      }
      if (detectedTime) {
        document.getElementById("editTime").value = detectedTime;
        document.getElementById("timeDetectedTag").style.display = "inline";
      }

      const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 2);
      if (lines.length > 0 && !document.getElementById("editTitle").value) {
        document.getElementById("editTitle").value = lines[0].substring(0, 30);
      }
    }

    /* ========================================================
       【重要】英語を訳す・漢字の読み方・言葉の意味 ロジック
       ======================================================== */

    // 1. 英語を訳す (英和翻訳)
    async function executeTranslate(query) {
      if (!query || !query.trim()) {
        showToast("翻訳したい英語を入力または撮影してください");
        return;
      }
      const q = query.trim();
      showToast("翻訳中...");

      try {
        // MyMemory Translation API (無料・登録不要・CORS対応)
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=en|ja`;
        const res = await fetch(url);
        const data = await res.json();
        const translated = data.responseData ? data.responseData.translatedText : "翻訳を取得できませんでした";

        displayKnowledgeResult(
          "blue",
          `<i class="fa-solid fa-globe"></i> 英語の日本語訳`,
          `🇺🇸 原文: ${q}`,
          `🇯🇵 日本語訳: <strong>${translated}</strong>`,
          q,
          "en-US",
          [
            { label: "Google翻訳で開く", url: `https://translate.google.com/?sl=en&tl=ja&text=${encodeURIComponent(q)}&op=translate` },
            { label: "Weblio英和辞典", url: `https://ejje.weblio.jp/content/${encodeURIComponent(q)}` }
          ]
        );
      } catch (err) {
        // フォールバック
        displayKnowledgeResult(
          "blue",
          `<i class="fa-solid fa-globe"></i> 英語の日本語訳`,
          `🇺🇸 原文: ${q}`,
          `外部辞書で詳細な翻訳を確認できます。`,
          q,
          "en-US",
          [
            { label: "Google翻訳で開く", url: `https://translate.google.com/?sl=en&tl=ja&text=${encodeURIComponent(q)}&op=translate` },
            { label: "Weblio英和辞典", url: `https://ejje.weblio.jp/content/${encodeURIComponent(q)}` }
          ]
        );
      }
    }

    // 2. 漢字の読み方を調べる
    function executeKanjiReading(query) {
      if (!query || !query.trim()) {
        showToast("読み方を調べたい漢字を入力または撮影してください");
        return;
      }
      const q = query.trim();
      showToast("漢字の読み方を調べています...");

      // 音声読み上げ準備
      currentVoiceText = q;
      currentVoiceLang = "ja-JP";

      displayKnowledgeResult(
        "purple",
        `<i class="fa-solid fa-font"></i> 漢字の読み方`,
        `🈩 漢字: ${q}`,
        `「<strong>音声で聴く</strong>」ボタンを押すと、この漢字の正しい日本語の読み上げ音が流れます！<br>さらに詳細な部首・画数・音訓読みは以下の辞書でワンタップ確認できます。`,
        q,
        "ja-JP",
        [
          { label: "漢字ペディアで調べる", url: `https://www.kanjipedia.jp/search?k=${encodeURIComponent(q)}` },
          { label: "コトバンクで読み方", url: `https://kotobank.jp/word/${encodeURIComponent(q)}` },
          { label: "Googleで読み方検索", url: `https://www.google.com/search?q=${encodeURIComponent(q + ' 読み方')}` }
        ]
      );
      // 自動で音声発音
      readAloudCurrent();
    }

    // 3. 言葉の意味を調べる (国語辞典・百科事典)
    async function executeWordMeaning(query) {
      if (!query || !query.trim()) {
        showToast("意味を調べたい言葉を入力または撮影してください");
        return;
      }
      const q = query.trim();
      showToast("言葉の意味を検索中...");

      try {
        // Wikipedia 日本語要約API
        const wikiUrl = `https://ja.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&format=json&origin=*&titles=${encodeURIComponent(q)}`;
        const res = await fetch(wikiUrl);
        const data = await res.json();
        const pages = data.query ? data.query.pages : {};
        const page = Object.values(pages)[0];

        let explanation = "";
        if (page && page.extract) {
          explanation = page.extract.substring(0, 220) + (page.extract.length > 220 ? "..." : "");
        } else {
          explanation = `『${q}』に関する解説を以下の辞書リンクよりワンタップで詳しくご覧いただけます。`;
        }

        displayKnowledgeResult(
          "green",
          `<i class="fa-solid fa-book"></i> 言葉の意味・解説`,
          `📖 用語: ${q}`,
          explanation,
          q,
          "ja-JP",
          [
            { label: "コトバンク国語辞典", url: `https://kotobank.jp/word/${encodeURIComponent(q)}` },
            { label: "goo辞書で調べる", url: `https://dictionary.goo.ne.jp/srch/jn/${encodeURIComponent(q)}/m0u/` },
            { label: "Wikipediaで全文を読む", url: `https://ja.wikipedia.org/wiki/${encodeURIComponent(q)}` }
          ]
        );
      } catch (e) {
        displayKnowledgeResult(
          "green",
          `<i class="fa-solid fa-book"></i> 言葉の意味・解説`,
          `📖 用語: ${q}`,
          `『${q}』の意味を各種辞書で検索できます。`,
          q,
          "ja-JP",
          [
            { label: "コトバンク国語辞典", url: `https://kotobank.jp/word/${encodeURIComponent(q)}` },
            { label: "goo辞書で調べる", url: `https://dictionary.goo.ne.jp/srch/jn/${encodeURIComponent(q)}/m0u/` }
          ]
        );
      }
    }

    // 知的結果の画面描画

    // 音声読み上げ (Web Speech API)
    function readAloudCurrent() {
      if (!('speechSynthesis' in window)) {
        showToast("この端末は音声読み上げに対応していません");
        return;
      }
      if (!currentVoiceText) return;

      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(currentVoiceText);
      u.lang = currentVoiceLang || "ja-JP";
      u.rate = 0.95; // 聴き取りやすい少し落ち着いた速度
      window.speechSynthesis.speak(u);
      showToast("音声を再生しています🔊");
    }

      document.getElementById("dictQueryInput").value = "";
      document.getElementById("knowledgeResultCard").style.display = "none";

    /* ========================================================
       カレンダーログ＆保存 ロジック
       ======================================================== */
    async function saveToCalendarLog(closeModal = true) {
      const title = document.getElementById("editTitle").value.trim() || "撮影メモ";
      const date = document.getElementById("editDate").value;
      const time = document.getElementById("editTime").value || "09:00";
      const memo = document.getElementById("editMemo").value.trim();

      const logItem = {
        title: title,
        date: date,
        time: time,
        memo: memo,
        image: capturedDataUrl,
        isRegistered: false,
        createdAt: new Date().toISOString()
      };

      await addLogToDB(logItem);
      showToast("カレンダーログに保存しました！");
      if (closeModal) closeEditSheet();
      loadLogs();
      updateBadge();
    }

    function addLogToDB(item) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(["logs"], "readwrite");
        const store = tx.objectStore("logs");
        const req = store.add(item);
        req.onsuccess = () => resolve(req.result);
        req.onerror = (e) => reject(e);
      });
    }

    function getAllLogs() {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(["logs"], "readonly");
        const store = tx.objectStore("logs");
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = (e) => reject(e);
      });
    }

    function deleteLogFromDB(id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(["logs"], "readwrite");
        const store = tx.objectStore("logs");
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e);
      });
    }

    function updateLogStatusInDB(id, isRegistered) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(["logs"], "readwrite");
        const store = tx.objectStore("logs");
        const getReq = store.get(id);
        getReq.onsuccess = () => {
          const data = getReq.result;
          if (data) {
            data.isRegistered = isRegistered;
            store.put(data);
            resolve();
          }
        };
        getReq.onerror = (e) => reject(e);
      });
    }

    async function loadLogs() {
      const logs = await getAllLogs();
      logs.sort((a, b) => (b.date + " " + b.time).localeCompare(a.date + " " + a.time));

      const logContainer = document.getElementById("calendarLogList");
      const galleryContainer = document.getElementById("galleryList");

      if (logs.length === 0) {
        logContainer.innerHTML = `
          <div class="empty-state">
            <i class="fa-regular fa-calendar-xmark empty-icon"></i>
            <p>カレンダーログはまだありません</p>
            <p style="font-size:0.8rem; margin-top:6px;">拡大鏡でチラシや予定表を撮影すると、自動でここに予定がリストアップされます。</p>
          </div>
        `;
        galleryContainer.innerHTML = `
          <div class="empty-state">
            <i class="fa-regular fa-images empty-icon"></i>
            <p>保存された写真メモはありません</p>
          </div>
        `;
        return;
      }

      logContainer.innerHTML = logs.map(item => `
        <div class="log-card ${item.isRegistered ? 'status-registered' : ''}" id="logCard_${item.id}">
          <div class="log-card-header">
            <img src="${item.image}" class="log-thumb" onclick="openImageModal('${item.image}')" title="タップで写真拡大">
            <div class="log-info">
              <div class="log-date-badge">
                <i class="fa-regular fa-calendar-check"></i> ${formatDisplayDate(item.date, item.time)}
              </div>
              <div class="log-title">${escapeHtml(item.title)}</div>
              <div class="log-memo">${escapeHtml(item.memo || 'メモなし')}</div>
            </div>
          </div>
          <div class="log-card-actions">
            <button class="cal-add-btn" onclick="registerToGoogleCalendar('${encodeURIComponent(JSON.stringify(item))}')">
              <i class="fa-brands fa-google"></i> Googleカレンダーへ
            </button>
            <button class="cal-ics-btn" onclick="downloadIcsFile('${encodeURIComponent(JSON.stringify(item))}')">
              <i class="fa-solid fa-calendar"></i> スマホ本体へ (.ics)
            </button>
            <div class="log-sub-actions">
              <button class="card-icon-btn" onclick="toggleLogRegistered(${item.id}, ${!item.isRegistered})" title="登録済みにする">
                <i class="fa-solid fa-check" style="${item.isRegistered ? 'color:var(--accent-green);font-weight:bold;' : ''}"></i>
              </button>
              <button class="card-icon-btn delete" onclick="deleteLog(${item.id})" title="削除">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        </div>
      `).join("");

      galleryContainer.innerHTML = logs.map(item => `
        <div class="log-card">
          <div class="log-card-header">
            <img src="${item.image}" class="log-thumb" style="width:85px;height:85px;" onclick="openImageModal('${item.image}')">
            <div class="log-info">
              <div class="log-title" style="font-size:1rem;">${escapeHtml(item.title)}</div>
              <div style="font-size:0.8rem; color:var(--accent-gold); margin-bottom:4px;">
                <i class="fa-regular fa-clock"></i> ${item.date} ${item.time}
              </div>
              <div class="log-memo" style="-webkit-line-clamp:3;">${escapeHtml(item.memo || 'メモなし')}</div>
            </div>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:8px;">
            <a href="${item.image}" download="loupe_memo_${item.date}.jpg" class="card-icon-btn" title="画像を保存">
              <i class="fa-solid fa-download"></i>
            </a>
            <button class="card-icon-btn delete" onclick="deleteLog(${item.id})" title="削除">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>
      `).join("");
    }

    async function updateBadge() {
      const logs = await getAllLogs();
      const count = logs.filter(l => !l.isRegistered).length;
      document.getElementById("logBadge").innerText = count;
      document.getElementById("logBadge").style.display = count > 0 ? "inline" : "none";
    }

    async function toggleLogRegistered(id, isReg) {
      await updateLogStatusInDB(id, isReg);
      showToast(isReg ? "カレンダー登録済みにしました" : "未登録に戻しました");
      loadLogs();
      updateBadge();
    }

    async function deleteLog(id) {
      if (!confirm("このログを削除しますか？")) return;
      await deleteLogFromDB(id);
      showToast("削除しました");
      loadLogs();
      updateBadge();
    }

    function registerToGoogleCalendar(encodedItem) {
      const item = JSON.parse(decodeURIComponent(encodedItem));
      const dtStart = formatGoogleDate(item.date, item.time);
      const dtEnd = formatGoogleDate(item.date, getEndTime(item.time));

      const title = encodeURIComponent(item.title);
      const details = encodeURIComponent(`${item.memo}\n\n[スマート拡大鏡より転記]`);
      const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dtStart}/${dtEnd}&details=${details}`;

      window.open(url, "_blank");
      updateLogStatusInDB(item.id, true).then(() => {
        loadLogs();
        updateBadge();
      });
    }

    function directRegisterGoogle() {
      const title = encodeURIComponent(document.getElementById("editTitle").value.trim() || "撮影メモ");
      const date = document.getElementById("editDate").value;
      const time = document.getElementById("editTime").value || "09:00";
      const memo = encodeURIComponent(document.getElementById("editMemo").value.trim() + "\n\n[スマート拡大鏡より転記]");

      const dtStart = formatGoogleDate(date, time);
      const dtEnd = formatGoogleDate(date, getEndTime(time));
      const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dtStart}/${dtEnd}&details=${memo}`;

      saveToCalendarLog(false);
      window.open(url, "_blank");
      closeEditSheet();
    }

    function downloadIcsFile(encodedItem) {
      const item = JSON.parse(decodeURIComponent(encodedItem));
      generateAndDownloadIcs(item.title, item.date, item.time, item.memo);
      updateLogStatusInDB(item.id, true).then(() => {
        loadLogs();
        updateBadge();
      });
    }

    function directDownloadIcs() {
      const title = document.getElementById("editTitle").value.trim() || "撮影メモ";
      const date = document.getElementById("editDate").value;
      const time = document.getElementById("editTime").value || "09:00";
      const memo = document.getElementById("editMemo").value.trim();

      saveToCalendarLog(false);
      generateAndDownloadIcs(title, date, time, memo);
      closeEditSheet();
    }

    function generateAndDownloadIcs(title, dateStr, timeStr, memo) {
      const startIso = formatIcsDate(dateStr, timeStr);
      const endIso = formatIcsDate(dateStr, getEndTime(timeStr));
      const nowIso = formatIcsDateNow();

      const icsContent = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Smart Loupe App//JP",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH",
        "BEGIN:VEVENT",
        `UID:${Date.now()}@smartloupe.app`,
        `DTSTAMP:${nowIso}`,
        `DTSTART:${startIso}`,
        `DTEND:${endIso}`,
        `SUMMARY:${title}`,
        `DESCRIPTION:${memo.replace(/\n/g, "\\n")}\\n\\n[スマート拡大鏡より転記]`,
        "STATUS:CONFIRMED",
        "END:VEVENT",
        "END:VCALENDAR"
      ].join("\r\n");

      const blob = new Blob([icsContent], { type: "text/calendar;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `event_${dateStr.replace(/-/g, '')}.ics`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast("カレンダーファイル(.ics)を出力しました。タップしてカレンダーに追加できます！");
    }

    function formatGoogleDate(dateStr, timeStr) {
      const d = (dateStr || "").replace(/-/g, "");
      const t = (timeStr || "09:00").replace(/:/g, "") + "00";
      return `${d}T${t}`;
    }

    function formatIcsDate(dateStr, timeStr) {
      const d = (dateStr || "").replace(/-/g, "");
      const t = (timeStr || "09:00").replace(/:/g, "") + "00";
      return `${d}T${t}`;
    }

    function formatIcsDateNow() {
      const n = new Date();
      return n.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
    }

    function getEndTime(timeStr) {
      if (!timeStr) return "10:00";
      const parts = timeStr.split(":");
      let h = parseInt(parts[0], 10) + 1;
      if (h > 23) h = 23;
      return `${String(h).padStart(2, '0')}:${parts[1] || '00'}`;
    }

    function formatDisplayDate(dateStr, timeStr) {
      if (!dateStr) return "日付未設定";
      const parts = dateStr.split("-");
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      const days = ["日", "月", "火", "水", "木", "金", "土"];
      const dayName = days[d.getDay()] || "";
      return `${parts[0]}年${parseInt(parts[1], 10)}月${parseInt(parts[2], 10)}日(${dayName}) ${timeStr || ''}`;
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    // タブ切替
    function switchTab(tab) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".view-panel").forEach(p => p.classList.remove("active"));

      if (tab === 'loupe') {
        document.getElementById("tabLoupe").classList.add("active");
        document.getElementById("viewLoupe").classList.add("active");
      } else if (tab === 'dictionary') {
        document.getElementById("tabDictionary").classList.add("active");
        document.getElementById("viewDictionary").classList.add("active");
      } else if (tab === 'calendarLog') {
        document.getElementById("tabCalendarLog").classList.add("active");
        document.getElementById("viewCalendarLog").classList.add("active");
        loadLogs();
      } else if (tab === 'gallery') {
        document.getElementById("tabGallery").classList.add("active");
        document.getElementById("viewGallery").classList.add("active");
        loadLogs();
      }
    }

    function openImageModal(src) {
      document.getElementById("imageModalImg").src = src;
      document.getElementById("imageModal").classList.add("active");
    }

    function closeImageModal() {
      document.getElementById("imageModal").classList.remove("active");
    }

    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById("toast");
      document.getElementById("toastMsg").innerText = msg;
      t.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
    }

    function showHelpModal() {
      alert("【カレンダーログの使い方】\n\n1. 「拡大鏡」でチラシや予定表の日付部分を撮影します。\n2. 日付・時間が自動検出され、カレンダーログに保存されます。\n3. 「カレンダーログ」タブから『Googleカレンダーへ』または『スマホ本体へ』を押してワンタップで予定に登録できます！");
    }

    window.addEventListener("DOMContentLoaded", async () => {
      await initDB();
      await startCamera();
      loadLogs();
      updateBadge();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => {});
      }
    });
