<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>スマート拡大鏡 - 漢字読み＆英単語訳</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Tesseract.js (文字認識) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #151d2f;
      --accent: #38bdf8;
      --accent-gold: #facc15;
      --accent-green: #22c55e;
      --accent-purple: #c084fc;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* ヘッダー */
    .app-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      padding-top: max(8px, env(safe-area-inset-top));
      background: rgba(15, 23, 42, 0.98);
      border-bottom: 1px solid var(--border-color);
      z-index: 50;
    }

    .app-title {
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-gold);
      flex-shrink: 0;
    }

    .header-tabs {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .header-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: #1e293b;
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      padding: 5px 9px;
      border-radius: 18px;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: bold;
    }

    .badge-count {
      background: var(--accent-red);
      color: white;
      font-size: 0.65rem;
      padding: 1px 5px;
      border-radius: 10px;
    }

    /* メイン表示領域 */
    .view-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .view-panel {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
    }
    .view-panel.active { display: flex; }

    /* 拡大鏡ビュー */
    .loupe-view {
      position: relative;
      background: #000;
      width: 100%;
      height: 100%;
    }

    .camera-viewport {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }

    #videoElement {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
    }

    #freezeCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 10;
    }

    /* カメラ起動エラー/許可促進ボタン（カメラが映らない時用） */
    .camera-permission-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid var(--accent);
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 40;
      max-width: 85%;
    }
    .btn-start-camera {
      background: var(--accent);
      color: #0f172a;
      border: none;
      font-size: 1rem;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ★ ピンポイント照準枠（WebKitクラッシュの原因だった巨大box-shadowを完全排除） ★ */
    .pinpoint-reticle {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 68px;
      border: 2px solid var(--accent-gold);
      border-radius: 12px;
      z-index: 15;
      background: rgba(0, 0, 0, 0.15); /* 軽い透過背景 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4px;
      pointer-events: none;
    }
    .pinpoint-reticle.scanning {
      border-color: #38bdf8;
    }

    .reticle-center-cross {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      pointer-events: none;
    }
    .reticle-center-cross::before {
      content: ''; position: absolute; top: 7px; left: 0; width: 16px; height: 2px; background: var(--accent-gold);
    }
    .reticle-center-cross::after {
      content: ''; position: absolute; top: 0; left: 7px; width: 2px; height: 16px; background: var(--accent-gold);
    }

    .reticle-tag {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      font-size: 0.65rem;
      font-weight: bold;
      padding: 1px 8px;
      border-radius: 10px;
      margin-top: -12px;
      white-space: nowrap;
    }

    .zoom-overlay-tag {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 3px 9px;
      border-radius: 15px;
      font-size: 0.8rem;
      font-weight: bold;
      z-index: 20;
    }

    .live-scan-toggle {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.9);
      border: 1.5px solid var(--accent-green);
      color: white;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      z-index: 20;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .live-scan-toggle.off {
      border-color: #64748b;
      color: #94a3b8;
    }

    .freeze-badge {
      position: absolute;
      top: 48px;
      right: 12px;
      background: var(--accent-red);
      color: white;
      padding: 3px 9px;
      border-radius: 15px;
      font-size: 0.75rem;
      font-weight: bold;
      display: none;
      z-index: 20;
    }

    /* ★ 漢字読み・英単語訳 ポップアップカード ★ */
    .word-reading-popup {
      position: absolute;
      bottom: 145px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 380px;
      background: rgba(15, 23, 42, 0.98);
      border: 2px solid var(--accent-gold);
      border-radius: 14px;
      padding: 12px 14px;
      z-index: 25;
      display: none;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
    }

    .popup-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .popup-type-badge {
      font-size: 0.72rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .popup-type-badge.kanji { background: #581c87; color: #f5d0fe; border: 1px solid #c084fc; }
    .popup-type-badge.english { background: #1e3a8a; color: #93c5fd; border: 1px solid #3b82f6; }

    .popup-close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px 6px;
    }

    .word-target-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: white;
    }

    .word-reading-box {
      background: rgba(30, 41, 59, 0.9);
      border-left: 4px solid var(--accent-gold);
      padding: 8px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .reading-highlight {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent-gold);
      letter-spacing: 0.05em;
    }

    .word-meaning-text {
      font-size: 0.82rem;
      color: #cbd5e1;
      line-height: 1.4;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 8px;
      border-radius: 6px;
    }

    .sound-play-btn {
      background: #334155;
      border: 1px solid #64748b;
      color: var(--accent-gold);
      padding: 5px 10px;
      border-radius: 18px;
      font-size: 0.78rem;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 下部コントロールパネル */
    .loupe-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(to top, rgba(9, 13, 22, 0.98) 70%, rgba(9, 13, 22, 0.8) 90%, transparent);
      padding: 10px 14px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .zoom-slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(30, 41, 59, 0.85);
      padding: 5px 10px;
      border-radius: 25px;
      border: 1px solid var(--border-color);
    }
    .slider-icon { color: var(--accent-gold); font-size: 0.8rem; }
    .zoom-slider {
      flex: 1;
      -webkit-appearance: none;
      height: 6px;
      background: #475569;
      border-radius: 3px;
      outline: none;
    }
    .zoom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent-gold);
      cursor: pointer;
    }

    .preset-zooms { display: flex; gap: 3px; }
    .preset-btn {
      background: #0f172a;
      border: 1px solid #475569;
      color: #cbd5e1;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 6px;
      border-radius: 10px;
      cursor: pointer;
    }
    .preset-btn.active {
      background: var(--accent-gold);
      color: #0f172a;
      border-color: var(--accent-gold);
    }

    .action-buttons-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 4px;
    }

    .sub-action-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .sub-action-btn.active {
      background: var(--accent-gold);
      color: #0f172a;
      border-color: var(--accent-gold);
    }
    .sub-btn-label { font-size: 0.5rem; font-weight: 600; margin-top: 1px; }

    .shutter-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: white;
      border: 4px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      font-size: 1.4rem;
      cursor: pointer;
    }

    /* 共通ビュー */
    .calendar-log-view, .gallery-view, .dictionary-view {
      overflow-y: auto;
      padding: 14px;
      padding-bottom: 90px;
      background: var(--bg-dark);
      flex: 1;
    }

    .section-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .smart-tools-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .tool-input-row { display: flex; gap: 8px; }
    .tool-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: white;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      user-select: text;
    }
    .tool-action-btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .tool-btn {
      padding: 10px 6px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .tool-btn.translate { background: #1e3a8a; border-color: #3b82f6; color: #93c5fd; }
    .tool-btn.kanji { background: #701a75; border-color: #c084fc; color: #f5d0fe; }
    .tool-btn.meaning { background: #14532d; border-color: #22c55e; color: #bbf7d0; }

    .knowledge-result-card {
      background: #0f172a;
      border: 1.5px solid var(--accent);
      border-radius: 12px;
      padding: 14px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .result-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 6px;
      width: fit-content;
    }
    .result-badge.blue { background: #1e3a8a; color: #93c5fd; border: 1px solid #3b82f6; }
    .result-badge.purple { background: #581c87; color: #f5d0fe; border: 1px solid #c084fc; }

    .result-main-text { font-size: 1.15rem; font-weight: 700; color: white; line-height: 1.4; user-select: text; }
    .result-sub-text {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.5;
      user-select: text;
      background: rgba(30, 41, 59, 0.6);
      padding: 10px;
      border-radius: 8px;
      border-left: 3px solid var(--accent-gold);
    }

    /* ログ */
    .log-list { display: flex; flex-direction: column; gap: 12px; }
    .log-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .log-card-header { display: flex; align-items: flex-start; gap: 10px; }
    .log-thumb {
      width: 66px;
      height: 66px;
      border-radius: 8px;
      object-fit: cover;
      background: #0f172a;
      border: 1px solid var(--border-color);
      cursor: pointer;
      flex-shrink: 0;
    }
    .log-info { flex: 1; overflow: hidden; }
    .log-date-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(250, 204, 21, 0.15);
      border: 1px solid rgba(250, 204, 21, 0.4);
      color: var(--accent-gold);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      margin-bottom: 4px;
    }
    .log-title { font-size: 0.95rem; font-weight: 700; color: var(--text-main); margin-bottom: 3px; }
    .log-memo { font-size: 0.8rem; color: var(--text-sub); line-height: 1.35; }

    .log-card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      border-top: 1px solid rgba(51, 65, 85, 0.5);
      padding-top: 8px;
    }
    .cal-add-btn {
      flex: 1;
      min-width: 120px;
      background: #1e3a8a;
      border: 1px solid #3b82f6;
      color: white;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
    }
    .cal-ics-btn {
      flex: 1;
      min-width: 120px;
      background: #134e4a;
      border: 1px solid #14b8a6;
      color: white;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
    }
    .card-icon-btn {
      background: #1e293b;
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .card-icon-btn.delete { color: var(--accent-red); }

    /* モーダル */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.active { display: flex; }
    .modal-sheet {
      background: var(--card-bg);
      border-top: 2px solid var(--accent);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }
    .sheet-title { font-size: 1rem; font-weight: 700; color: var(--accent); }
    .sheet-close {
      background: #1e293b;
      border: none;
      color: var(--text-sub);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
    }
    .sheet-body { overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
    .captured-preview-box {
      border-radius: 8px;
      overflow: hidden;
      max-height: 140px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #capturedImagePreview { max-width: 100%; max-height: 140px; object-fit: contain; }

    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-label { font-size: 0.78rem; font-weight: 600; color: var(--text-sub); }
    .form-input, .form-textarea {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: white;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      user-select: text;
    }
    .datetime-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }
    .sheet-footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .btn-save-log {
      background: #0284c7;
      color: white;
      border: none;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .quick-cal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

    .toast {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
      z-index: 200;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    .image-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 150;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .image-modal.active { display: flex; }

    let currentStream = null;

      { name: "白黒反転", filter: "invert(100%) contrast(150%)" },

    let popupVoiceLang = "ja-JP";

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("SmartLoupeDB", 1);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains("logs")) {
            const store = d.createObjectStore("logs", { keyPath: "id", autoIncrement: true });
            store.createIndex("date", "date", { unique: false });
            store.createIndex("createdAt", "createdAt", { unique: false });
          }
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(db); };
        req.onerror = (e) => reject(e);
      });
    }

    async function startCamera(isUserTap = false) {
      const video = document.getElementById("videoElement");
      const permBox = document.getElementById("cameraPermissionBox");
      try {
        const constraints = {
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        currentStream = stream;
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
        permBox.style.display = "none";

        const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (capabilities.zoom) {
          maxHardwareZoom = capabilities.zoom.max || 1.0;
          document.getElementById("zoomSlider").max = Math.max(10, maxHardwareZoom);
        }
        startLiveScanningLoop();
      } catch (err) {
        console.warn("Camera init warning:", err);
        // カメラが自動起動できなかった場合は手動許可ボックスを表示
        permBox.style.display = "flex";
      }
    }

    function applyZoom(val) {
      currentZoom = parseFloat(val);
      document.getElementById("zoomBadge").innerText = `${currentZoom.toFixed(1)}x`;
      document.getElementById("zoomSlider").value = currentZoom;

      document.querySelectorAll(".preset-btn").forEach(btn => {
        const p = parseFloat(btn.innerText);
        btn.classList.toggle("active", Math.abs(p - currentZoom) < 0.2);
      });

      if (videoTrack && videoTrack.applyConstraints) {
        const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (capabilities.zoom) {
          const hwVal = Math.min(currentZoom, capabilities.zoom.max || 1.0);
          videoTrack.applyConstraints({ advanced: [{ zoom: hwVal }] }).catch(() => {});
          const cssZoom = currentZoom / hwVal;
          document.getElementById("videoElement").style.transform = `scale(${cssZoom})`;
          return;
        }
      }
      document.getElementById("videoElement").style.transform = `scale(${currentZoom})`;
    }

    function setZoom(val) { applyZoom(val); }
    document.getElementById("zoomSlider").addEventListener("input", (e) => applyZoom(e.target.value));

    async function toggleTorch() {
      if (!videoTrack || !videoTrack.applyConstraints) {
        showToast("この端末ではライト制御に対応していません");
        return;
      }
      try {
        isTorchOn = !isTorchOn;
        await videoTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
        document.getElementById("btnTorch").classList.toggle("active", isTorchOn);
        showToast(isTorchOn ? "ライト点灯" : "ライト消灯");
      } catch (e) {
        showToast("ライトの点灯に対応していません");
      }
    }

    function toggleFreeze() {
      const video = document.getElementById("videoElement");
      const canvas = document.getElementById("freezeCanvas");
      const badge = document.getElementById("freezeBadge");
      const btn = document.getElementById("btnFreeze");

      if (!isFrozen) {
        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.style.transform = video.style.transform;
        canvas.style.filter = video.style.filter;
        canvas.style.display = "block";
        video.style.visibility = "hidden";
        isFrozen = true;
        badge.style.display = "block";
        btn.classList.add("active");
        showToast("静止しました");
      } else {
        canvas.style.display = "none";
        video.style.visibility = "visible";
        isFrozen = false;
        badge.style.display = "none";
        btn.classList.remove("active");
      }
    }

    function cycleFilter() {
      currentFilterIdx = (currentFilterIdx + 1) % filterModes.length;
      const mode = filterModes[currentFilterIdx];
      const video = document.getElementById("videoElement");
      const canvas = document.getElementById("freezeCanvas");
      video.style.filter = mode.filter;
      canvas.style.filter = mode.filter;
      document.getElementById("filterLabel").innerText = mode.name;
      document.getElementById("btnFilter").classList.toggle("active", currentFilterIdx !== 0);
      showToast(`フィルター: ${mode.name}`);
    }

    /* ピンポイントスキャン */
    function toggleLiveScan() {
      isLiveScanActive = !isLiveScanActive;
      const btn = document.getElementById("btnLiveToggle");
      const text = document.getElementById("liveScanStatusText");
      const popup = document.getElementById("wordReadingPopup");
      const reticle = document.getElementById("pinpointReticle");

      if (isLiveScanActive) {
        btn.classList.remove("off");
        text.innerText = "かざすだけ ON";
        reticle.style.display = "flex";
        startLiveScanningLoop();
      } else {
        btn.classList.add("off");
        text.innerText = "かざすだけ OFF";
        popup.style.display = "none";
        reticle.style.display = "none";
        if (liveScanTimer) clearTimeout(liveScanTimer);
      }
    }

    function startLiveScanningLoop() {
      if (!isLiveScanActive) return;
      if (liveScanTimer) clearTimeout(liveScanTimer);

      liveScanTimer = setTimeout(async () => {
        const isLoupeVisible = document.getElementById("viewLoupe").classList.contains("active");
        const isModalOpen = document.getElementById("editSheet").classList.contains("active");

        if (isLoupeVisible && !isModalOpen && !isFrozen && !isOcrProcessing) {
          await scanPinpointTargetWord();
        }
        startLiveScanningLoop();
      }, 1500);
    }

    async function scanPinpointTargetWord() {
      const video = document.getElementById("videoElement");
      if (!video || !video.videoWidth) return;

      isOcrProcessing = true;
      const reticle = document.getElementById("pinpointReticle");
      reticle.classList.add("scanning");

      try {
        const cropCanvas = document.getElementById("cropCanvas");
        const vw = video.videoWidth;
        const vh = video.videoHeight;

        // ピンポイント中央エリアだけを抽出
        const cropW = Math.floor(vw * 0.35);
        const cropH = Math.floor(vh * 0.14);
        const cropX = Math.floor((vw - cropW) / 2);
        const cropY = Math.floor(vh * 0.38 - cropH / 2);

        cropCanvas.width = cropW * 2;
        cropCanvas.height = cropH * 2;
        const ctx = cropCanvas.getContext("2d");

        ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropCanvas.width, cropCanvas.height);

        // 二値化
        const imgData = ctx.getImageData(0, 0, cropCanvas.width, cropCanvas.height);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
          const v = g > 135 ? 255 : 0;
          d[i] = v; d[i + 1] = v; d[i + 2] = v;
        }
        ctx.putImageData(imgData, 0, 0);

        const targetDataUrl = cropCanvas.toDataURL("image/jpeg", 0.85);

        if (window.Tesseract) {
          const result = await Tesseract.recognize(targetDataUrl, 'jpn+eng');
          const text = (result.data.text || "").trim();
          if (text) {
            findAndDisplayWordReading(text);
          }
        }
      } catch (err) {
        console.warn(err);
      } finally {
        reticle.classList.remove("scanning");
        isOcrProcessing = false;
      }
    }

    async function findAndDisplayWordReading(rawText) {
      const cleaned = rawText.replace(/[\-_|\\\/~^`'"=;:.,*+?!#%&()<>\[\]{}0-9\s]/g, "");

      // 漢字辞書判定
      for (const [kWord, info] of Object.entries(KANJI_DATABASE)) {
        if (cleaned.includes(kWord)) {
          if (lastFoundWord === kWord) return;
          lastFoundWord = kWord;
          showPinpointWordPopup({
            type: "kanji",
            word: kWord,
            reading: `【 ${info.reading} 】`,
            meaning: info.meaning,
            voiceText: info.reading,
            voiceLang: "ja-JP"
          });
          return;
        }
      }

      // 英単語判定
      const engMatch = rawText.match(/[a-zA-Z]{3,}/g);
      if (engMatch && engMatch.length > 0) {
        const engWord = engMatch[0].toLowerCase();
        if (lastFoundWord === engWord) return;
        lastFoundWord = engWord;

        if (COMMON_ENGLISH_DICT[engWord]) {
          const eInfo = COMMON_ENGLISH_DICT[engWord];
          showPinpointWordPopup({
            type: "english",
            word: engWord.toUpperCase(),
            reading: `【 ${eInfo.ja} 】`,
            meaning: eInfo.desc,
            voiceText: engWord,
            voiceLang: "en-US"
          });
          return;
        }
      }
    }

    function showPinpointWordPopup(info) {
      const popup = document.getElementById("wordReadingPopup");
      const badge = document.getElementById("popupTypeBadge");
      const word = document.getElementById("popupTargetWord");
      const reading = document.getElementById("popupReadingText");
      const meaning = document.getElementById("popupMeaningText");

      popupVoiceWord = info.voiceText;
      popupVoiceLang = info.voiceLang;

      if (info.type === "kanji") {
        badge.className = "popup-type-badge kanji";
        badge.innerHTML = "🈩 漢字の読み方";
      } else {
        badge.className = "popup-type-badge english";
        badge.innerHTML = "🇺🇸 英語の意味";
      }

      word.innerText = info.word;
      reading.innerText = info.reading;
      meaning.innerText = info.meaning;
      popup.style.display = "flex";
    }

    function closeWordPopup() {
      document.getElementById("wordReadingPopup").style.display = "none";
      lastFoundWord = "";
    }

    function readAloudPopup() {
      if (!('speechSynthesis' in window)) return;
      if (!popupVoiceWord) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(popupVoiceWord);
      u.lang = popupVoiceLang || "ja-JP";
      u.rate = 0.90;
      window.speechSynthesis.speak(u);
    }

    // 撮影
    function captureCurrentFrame() {
      const video = document.getElementById("videoElement");
      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext("2d");
      if (isFrozen) {
        ctx.drawImage(document.getElementById("freezeCanvas"), 0, 0, canvas.width, canvas.height);
      } else {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      }
      return canvas.toDataURL("image/jpeg", 0.9);
    }

    function captureAndOpenSheet() {
      capturedDataUrl = captureCurrentFrame();
      openEditSheet(capturedDataUrl);
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        capturedDataUrl = evt.target.result;
        openEditSheet(capturedDataUrl);
      };
      reader.readAsDataURL(file);
    }

    function openEditSheet(imgUrl) {
      document.getElementById("capturedImagePreview").src = imgUrl;
      const now = new Date();
      document.getElementById("editTitle").value = "";
      document.getElementById("editDate").value = now.toISOString().split("T")[0];
      document.getElementById("editTime").value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      document.getElementById("editMemo").value = "";
      document.getElementById("editSheet").classList.add("active");
      runOcrScan();
    }

    function closeEditSheet() {
      document.getElementById("editSheet").classList.remove("active");
    }

    async function runOcrScan() {
      try {
        if (window.Tesseract) {
          const result = await Tesseract.recognize(capturedDataUrl, 'jpn+eng');
          const text = (result.data.text || "").trim();
          if (text) {
            document.getElementById("editMemo").value = text;
            const matchYmd = text.match(/(?:(\d{4}|令(?:和)?\s*(\d{1,2}))[年\/\.\-])?\s*(\d{1,2})[月\/\.\-](\d{1,2})日?/);
            if (matchYmd) {
              const y = matchYmd[1] ? (matchYmd[1].startsWith("令") ? 2018 + parseInt(matchYmd[2]||1,10) : parseInt(matchYmd[1],10)) : 2026;
              document.getElementById("editDate").value = `${y}-${String(matchYmd[3]).padStart(2,'0')}-${String(matchYmd[4]).padStart(2,'0')}`;
            }
          }
        }
      } catch (err) {}
    }

    /* 辞書タブ用 */
    function executeKanjiReading(query) {
      if (!query || !query.trim()) return;
      const q = query.trim();
      let reading = "";
      let meaning = "";
      for (const [k, v] of Object.entries(KANJI_DATABASE)) {
        if (q.includes(k) || k.includes(q)) {
          reading = v.reading; meaning = v.meaning; break;
        }
      }
      displayKnowledgeResult("purple", `🈩 漢字の読み方`, `漢字: ${q}`, reading ? `読み方: 【<strong style="color:var(--accent-gold); font-size:1.2rem;">${reading}</strong>】<br>${meaning}` : `「音声」を押すと読み上げられます。`, reading || q, "ja-JP");
      readAloudCurrent();
    }

    async function executeTranslate(query) {
      if (!query || !query.trim()) return;
      const q = query.trim();
      let translated = "";
      for (const [eKey, jVal] of Object.entries(COMMON_ENGLISH_DICT)) {
        if (q.toLowerCase() === eKey) { translated = jVal.ja; break; }
      }
      displayKnowledgeResult("blue", `🇺🇸 英語の日本語訳`, `英語: ${q}`, `意味: 【<strong style="color:#93c5fd; font-size:1.2rem;">${translated || '意味を検索'}</strong>】`, q, "en-US");
      readAloudCurrent();
    }

    async function executeWordMeaning(query) {
      if (!query || !query.trim()) return;
      const q = query.trim();
      let meaning = "";
      for (const [k, v] of Object.entries(KANJI_DATABASE)) {
        if (q.includes(k)) { meaning = `【${v.reading}】${v.meaning}`; break; }
      }
      displayKnowledgeResult("green", `📖 言葉の意味`, `用語: ${q}`, meaning || `辞書にてご確認ください。`, q, "ja-JP");
    }

    function displayKnowledgeResult(badgeColor, badgeHtml, mainHtml, subHtml, voiceText, voiceLang) {
      const card = document.getElementById("knowledgeResultCard");
      const badge = document.getElementById("resultTypeBadge");
      badge.className = `result-badge ${badgeColor}`;
      badge.innerHTML = badgeHtml;
      document.getElementById("resultMainText").innerHTML = mainHtml;
      document.getElementById("resultSubText").innerHTML = subHtml;
      popupVoiceWord = voiceText;
      popupVoiceLang = voiceLang;
      card.style.display = "flex";
    }

    function readAloudCurrent() {
      if (!('speechSynthesis' in window)) return;
      if (!popupVoiceWord) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(popupVoiceWord);
      u.lang = popupVoiceLang || "ja-JP";
      u.rate = 0.90;
      window.speechSynthesis.speak(u);
    }

    function clearDictInput() {
      document.getElementById("dictQueryInput").value = "";
      document.getElementById("knowledgeResultCard").style.display = "none";
    }

    /* カレンダーログ */
    async function saveToCalendarLog(closeModal = true) {
      const title = document.getElementById("editTitle").value.trim() || "撮影メモ";
      const date = document.getElementById("editDate").value;
      const time = document.getElementById("editTime").value || "09:00";
      const memo = document.getElementById("editMemo").value.trim();

      const item = {
        title: title, date: date, time: time, memo: memo,
        image: capturedDataUrl, isRegistered: false, createdAt: new Date().toISOString()
      };
      await addLogToDB(item);
      showToast("カレンダーログに保存しました！");
      if (closeModal) closeEditSheet();
      loadLogs();
      updateBadge();
    }

    function addLogToDB(item) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(["logs"], "readwrite");
        tx.objectStore("logs").add(item);
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e);
      });
    }

    function getAllLogs() {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(["logs"], "readonly");
        const req = tx.objectStore("logs").getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = (e) => reject(e);
      });
    }

    async function loadLogs() {
      const logs = await getAllLogs();
      logs.sort((a, b) => (b.date + " " + b.time).localeCompare(a.date + " " + a.time));

      const logContainer = document.getElementById("calendarLogList");
      const galleryContainer = document.getElementById("galleryList");

      if (logs.length === 0) {
        logContainer.innerHTML = `<div style="text-align:center; padding:30px; color:#94a3b8;">カレンダーログはありません</div>`;
        galleryContainer.innerHTML = `<div style="text-align:center; padding:30px; color:#94a3b8;">写真メモはありません</div>`;
        return;
      }

      logContainer.innerHTML = logs.map(item => `
        <div class="log-card">
          <div class="log-card-header">
            <img src="${item.image}" class="log-thumb">
            <div class="log-info">
              <div class="log-date-badge">${item.date} ${item.time}</div>
              <div class="log-title">${escapeHtml(item.title)}</div>
              <div class="log-memo">${escapeHtml(item.memo)}</div>
            </div>
          </div>
          <div class="log-card-actions">
            <button class="cal-add-btn" onclick="directRegisterGoogleItem('${encodeURIComponent(JSON.stringify(item))}')">Googleカレンダーへ</button>
            <button class="cal-ics-btn" onclick="downloadIcsItem('${encodeURIComponent(JSON.stringify(item))}')">スマホ本体へ (.ics)</button>
          </div>
        </div>
      `).join("");

      galleryContainer.innerHTML = logs.map(item => `
        <div class="log-card">
          <div class="log-card-header">
            <img src="${item.image}" class="log-thumb" style="width:85px;height:85px;">
            <div class="log-info">
              <div class="log-title">${escapeHtml(item.title)}</div>
              <div class="log-memo">${escapeHtml(item.memo)}</div>
            </div>
          </div>
        </div>
      `).join("");
    }

    async function updateBadge() {
      const logs = await getAllLogs();
      const count = logs.length;
      document.getElementById("logBadge").innerText = count;
      document.getElementById("logBadge").style.display = count > 0 ? "inline" : "none";
    }

    function directRegisterGoogle() {
      const title = encodeURIComponent(document.getElementById("editTitle").value.trim() || "メモ");
      const d = (document.getElementById("editDate").value || "").replace(/-/g, "");
      const t = (document.getElementById("editTime").value || "09:00").replace(/:/g, "") + "00";
      const dt = `${d}T${t}`;
      const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dt}/${dt}`;
      saveToCalendarLog(false);
      window.open(url, "_blank");
      closeEditSheet();
    }

    function directRegisterGoogleItem(encoded) {
      const item = JSON.parse(decodeURIComponent(encoded));
      const d = (item.date || "").replace(/-/g, "");
      const t = (item.time || "09:00").replace(/:/g, "") + "00";
      const dt = `${d}T${t}`;
      const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(item.title)}&dates=${dt}/${dt}`;
      window.open(url, "_blank");
    }

    function directDownloadIcs() {
      const title = document.getElementById("editTitle").value.trim() || "メモ";
      const dateStr = document.getElementById("editDate").value;
      saveToCalendarLog(false);
      makeIcsDownload(title, dateStr);
      closeEditSheet();
    }

    function downloadIcsItem(encoded) {
      const item = JSON.parse(decodeURIComponent(encoded));
      makeIcsDownload(item.title, item.date);
    }

    function makeIcsDownload(title, dateStr) {
      const d = (dateStr || "").replace(/-/g, "") + "T090000";
      const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "BEGIN:VEVENT", `SUMMARY:${title}`, `DTSTART:${d}`, `DTEND:${d}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
      const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `event.ics`;
      link.click();
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    function switchTab(tab) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".view-panel").forEach(p => p.classList.remove("active"));

      if (tab === 'loupe') {
        document.getElementById("tabLoupe").classList.add("active");
        document.getElementById("viewLoupe").classList.add("active");
      } else if (tab === 'dictionary') {
        document.getElementById("tabDictionary").classList.add("active");
        document.getElementById("viewDictionary").classList.add("active");
      } else if (tab === 'calendarLog') {
        document.getElementById("tabCalendarLog").classList.add("active");
        document.getElementById("viewCalendarLog").classList.add("active");
        loadLogs();
      } else if (tab === 'gallery') {
        document.getElementById("tabGallery").classList.add("active");
        document.getElementById("viewGallery").classList.add("active");
        loadLogs();
      }
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      document.getElementById("toastMsg").innerText = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2800);
    }

    window.addEventListener("DOMContentLoaded", async () => {
      await initDB();
      await startCamera();
      loadLogs();
      updateBadge();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    });
  </script>
