<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>スマート拡大鏡 - ピンポイント漢字読み＆英単語訳</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Tesseract.js (文字認識) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #151d2f;
      --accent: #38bdf8;
      --accent-gold: #facc15;
      --accent-green: #22c55e;
      --accent-purple: #c084fc;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ヘッダー */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      padding-top: max(8px, env(safe-area-inset-top));
      background: rgba(15, 23, 42, 0.98);
      border-bottom: 1px solid var(--border-color);
      z-index: 50;
      overflow-x: auto;
      white-space: nowrap;
    }

    .app-title {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-gold);
      margin-right: 8px;
      flex-shrink: 0;
    }

    .header-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .header-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: #1e293b;
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .badge-count {
      background: var(--accent-red);
      color: white;
      font-size: 0.65rem;
      padding: 1px 5px;
      border-radius: 10px;
      font-weight: bold;
    }

    .view-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .view-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
    }

    .view-panel.active { display: flex; }

    /* 拡大鏡ビュー */
    .loupe-view {
      position: relative;
      background: #000;
      justify-content: space-between;
    }

    .camera-viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #videoElement {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
      transition: transform 0.05s ease-out, filter 0.2s ease;
    }

    #freezeCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 10;
    }

    /* ★ ピンポイント照準（知りたい文字1つに合わせる小型ターゲット） ★ */
    .pinpoint-reticle {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 170px;
      height: 64px;
      border: 2px solid var(--accent-gold);
      border-radius: 10px;
      z-index: 15;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4), 0 0 12px rgba(250, 204, 21, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4px;
      pointer-events: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .pinpoint-reticle.scanning {
      border-color: #38bdf8;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4), 0 0 18px rgba(56, 189, 248, 0.8);
    }

    .reticle-center-cross {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      pointer-events: none;
    }
    .reticle-center-cross::before, .reticle-center-cross::after {
      content: '';
      position: absolute;
      background: var(--accent-gold);
    }
    .reticle-center-cross::before {
      top: 7px; left: 0; width: 16px; height: 2px;
    }
    .reticle-center-cross::after {
      top: 0; left: 7px; width: 2px; height: 16px;
    }

    .reticle-tag {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      font-size: 0.68rem;
      font-weight: bold;
      padding: 1px 8px;
      border-radius: 10px;
      margin-top: -12px;
    }

    .zoom-overlay-tag {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      z-index: 20;
      backdrop-filter: blur(4px);
    }

    .live-scan-toggle {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(15, 23, 42, 0.9);
      border: 1.5px solid var(--accent-green);
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      z-index: 20;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
    }
    .live-scan-toggle.off {
      border-color: #64748b;
      color: #94a3b8;
      box-shadow: none;
    }

    .freeze-badge {
      position: absolute;
      top: 50px;
      right: 14px;
      background: var(--accent-red);
      color: white;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: bold;
      display: none;
      z-index: 20;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    /* ★ かざした文字の「漢字読み」「英単語訳」ポップアップカード ★ */
    .word-reading-popup {
      position: absolute;
      bottom: 135px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.96);
      border: 2px solid var(--accent-gold);
      border-radius: 16px;
      padding: 14px 16px;
      z-index: 25;
      display: none;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      animation: slideUpPopup 0.2s ease-out;
    }
    @keyframes slideUpPopup {
      from { transform: translateX(-50%) translateY(15px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }

    .popup-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .popup-type-badge {
      font-size: 0.75rem;
      font-weight: bold;
      padding: 3px 9px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .popup-type-badge.kanji { background: #581c87; color: #f5d0fe; border: 1px solid #c084fc; }
    .popup-type-badge.english { background: #1e3a8a; color: #93c5fd; border: 1px solid #3b82f6; }
    .popup-type-badge.date { background: #14532d; color: #86efac; border: 1px solid #22c55e; }

    .popup-close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.1rem;
      cursor: pointer;
    }

    /* 漢字読みのメイン表示 */
    .kanji-reading-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .word-target-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: white;
      letter-spacing: 0.05em;
    }

    .word-reading-box {
      background: rgba(30, 41, 59, 0.9);
      border-left: 4px solid var(--accent-gold);
      padding: 8px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .reading-highlight {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--accent-gold);
      letter-spacing: 0.08em;
    }

    .word-meaning-text {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.45;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 10px;
      border-radius: 6px;
    }

    .sound-play-btn {
      background: #334155;
      border: 1px solid #64748b;
      color: var(--accent-gold);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      width: fit-content;
      margin-top: 4px;
    }
    .sound-play-btn:active {
      background: var(--accent-gold);
      color: #0f172a;
    }

    /* 下部コントロールバー */
    .loupe-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(to top, rgba(9, 13, 22, 0.98) 60%, rgba(9, 13, 22, 0.75) 90%, transparent);
      padding: 10px 14px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .zoom-slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(30, 41, 59, 0.85);
      padding: 6px 12px;
      border-radius: 30px;
      border: 1px solid var(--border-color);
      backdrop-filter: blur(6px);
    }
    .slider-icon { color: var(--accent-gold); font-size: 0.85rem; }

    .zoom-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: #475569;
      border-radius: 3px;
      outline: none;
    }
    .zoom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent-gold);
      cursor: pointer;
      box-shadow: 0 0 8px rgba(250, 204, 21, 0.8);
    }

    .preset-zooms { display: flex; gap: 4px; }
    .preset-btn {
      background: #0f172a;
      border: 1px solid #475569;
      color: #cbd5e1;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 6px;
      border-radius: 12px;
      cursor: pointer;
    }
    .preset-btn.active {
      background: var(--accent-gold);
      color: #0f172a;
      border-color: var(--accent-gold);
    }

    .action-buttons-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 4px;
    }

    .sub-action-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sub-action-btn.active {
      background: var(--accent-gold);
      color: #0f172a;
      border-color: var(--accent-gold);
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.5);
    }
    .sub-btn-label { font-size: 0.52rem; font-weight: 600; margin-top: 1px; }

    .shutter-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: white;
      border: 4px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
      transition: transform 0.1s;
    }
    .shutter-btn:active { transform: scale(0.92); }

    /* 共通ビュー */
    .calendar-log-view, .gallery-view, .dictionary-view {
      overflow-y: auto;
      padding: 14px;
      padding-bottom: 90px;
      background: var(--bg-dark);
      flex: 1;
    }

    .section-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .smart-tools-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .tool-input-row { display: flex; gap: 8px; }
    .tool-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: white;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      user-select: text;
    }
    .tool-action-btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .tool-btn {
      padding: 10px 6px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .tool-btn.translate { background: #1e3a8a; border-color: #3b82f6; color: #93c5fd; }
    .tool-btn.kanji { background: #701a75; border-color: #c084fc; color: #f5d0fe; }
    .tool-btn.meaning { background: #14532d; border-color: #22c55e; color: #bbf7d0; }

    .knowledge-result-card {
      background: #0f172a;
      border: 1.5px solid var(--accent);
      border-radius: 12px;
      padding: 14px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .result-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 6px;
      width: fit-content;
    }
    .result-badge.blue { background: #1e3a8a; color: #93c5fd; border: 1px solid #3b82f6; }
    .result-badge.purple { background: #581c87; color: #f5d0fe; border: 1px solid #c084fc; }
    .result-badge.green { background: #14532d; color: #bbf7d0; border: 1px solid #22c55e; }

    .result-main-text { font-size: 1.15rem; font-weight: 700; color: white; line-height: 1.4; user-select: text; }
    .result-sub-text {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.5;
      user-select: text;
      background: rgba(30, 41, 59, 0.6);
      padding: 10px;
      border-radius: 8px;
      border-left: 3px solid var(--accent-gold);
    }

    /* ログ一覧 */
    .log-list { display: flex; flex-direction: column; gap: 12px; }
    .log-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    .log-card.status-registered { border-color: rgba(34, 197, 94, 0.5); }
    .log-card-header { display: flex; align-items: flex-start; gap: 10px; }
    .log-thumb {
      width: 66px;
      height: 66px;
      border-radius: 8px;
      object-fit: cover;
      background: #0f172a;
      border: 1px solid var(--border-color);
      cursor: pointer;
      flex-shrink: 0;
    }
    .log-info { flex: 1; overflow: hidden; }
    .log-date-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(250, 204, 21, 0.15);
      border: 1px solid rgba(250, 204, 21, 0.4);
      color: var(--accent-gold);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      margin-bottom: 4px;
    }
    .log-title { font-size: 0.95rem; font-weight: 700; color: var(--text-main); margin-bottom: 3px; word-break: break-all; }
    .log-memo {
      font-size: 0.8rem;
      color: var(--text-sub);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .log-card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      border-top: 1px solid rgba(51, 65, 85, 0.5);
      padding-top: 8px;
    }
    .cal-add-btn {
      flex: 1;
      min-width: 120px;
      background: #1e3a8a;
      border: 1px solid #3b82f6;
      color: white;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
    }
    .cal-ics-btn {
      flex: 1;
      min-width: 120px;
      background: #134e4a;
      border: 1px solid #14b8a6;
      color: white;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
    }
    .log-sub-actions { display: flex; gap: 5px; margin-left: auto; }
    .card-icon-btn {
      background: #1e293b;
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .card-icon-btn.delete { color: var(--accent-red); }

    .empty-state { text-align: center; padding: 36px 16px; color: var(--text-sub); }
    .empty-icon { font-size: 2.8rem; color: #334155; margin-bottom: 10px; }

    /* モーダル */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .modal-backdrop.active { display: flex; }

    .modal-sheet {
      background: var(--card-bg);
      border-top: 2px solid var(--accent);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.25s ease-out;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }
    .sheet-title { font-size: 1.05rem; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 6px; }
    .sheet-close {
      background: #1e293b;
      border: none;
      color: var(--text-sub);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
    }
    .sheet-body { overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }

    .captured-preview-box {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      max-height: 150px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-color);
    }
    #capturedImagePreview { max-width: 100%; max-height: 150px; object-fit: contain; }

    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-label { font-size: 0.8rem; font-weight: 600; color: var(--text-sub); display: flex; align-items: center; gap: 6px; }
    .form-input, .form-textarea {

<body>

              </div>

            </div>

      </div>

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("SmartLoupeDB", 1);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains("logs")) {
            const store = d.createObjectStore("logs", { keyPath: "id", autoIncrement: true });
            store.createIndex("date", "date", { unique: false });
            store.createIndex("createdAt", "createdAt", { unique: false });
          }
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(db); };
        req.onerror = (e) => reject(e);
      });
    }

    async function startCamera() {
      const video = document.getElementById("videoElement");
      try {
        const constraints = {
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        currentStream = stream;
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];

        const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (capabilities.zoom) {
          maxHardwareZoom = capabilities.zoom.max || 1.0;
          document.getElementById("zoomSlider").max = Math.max(10, maxHardwareZoom);
        }
        startLiveScanningLoop();
      } catch (err) {
        console.warn("カメラ起動注意:", err);
      }
    }

    function applyZoom(val) {
      currentZoom = parseFloat(val);
      document.getElementById("zoomBadge").innerText = `${currentZoom.toFixed(1)}x`;
      document.getElementById("zoomSlider").value = currentZoom;

      document.querySelectorAll(".preset-btn").forEach(btn => {
        const p = parseFloat(btn.innerText);
        btn.classList.toggle("active", Math.abs(p - currentZoom) < 0.2);
      });

      if (videoTrack && videoTrack.applyConstraints) {
        const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (capabilities.zoom) {
          const hwVal = Math.min(currentZoom, capabilities.zoom.max || 1.0);
          videoTrack.applyConstraints({ advanced: [{ zoom: hwVal }] }).catch(() => {});
          const cssZoom = currentZoom / hwVal;
          document.getElementById("videoElement").style.transform = `scale(${cssZoom})`;
          return;
        }
      }
      document.getElementById("videoElement").style.transform = `scale(${currentZoom})`;
    }

    function setZoom(val) { applyZoom(val); }
    document.getElementById("zoomSlider").addEventListener("input", (e) => applyZoom(e.target.value));

    // ピンチ操作
    let touchStartDist = 0;
    let initialZoomOnTouch = 1.0;
    const viewport = document.getElementById("viewport");
    viewport.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        touchStartDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
        initialZoomOnTouch = currentZoom;
      }
    }, { passive: true });
    viewport.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2 && touchStartDist > 0) {
        const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
        applyZoom(Math.min(10, Math.max(1, initialZoomOnTouch * (dist / touchStartDist))));
      }
    }, { passive: true });

    // 画面中央の小さなピンポイント枠の中だけを極小切り抜きしてスキャン
    async function scanPinpointTargetWord() {
      const video = document.getElementById("videoElement");
      if (!video || !video.videoWidth) return;

      isOcrProcessing = true;
      const reticle = document.getElementById("pinpointReticle");
      reticle.classList.add("scanning");

      try {
        const cropCanvas = document.getElementById("cropCanvas");
        const vw = video.videoWidth;
        const vh = video.videoHeight;

        // ★ 画像全体ではなく、中央の小さな枠（横幅の約30%、縦幅の約10%）だけをピンポイント抽出！ ★
        const cropW = Math.floor(vw * 0.32);
        const cropH = Math.floor(vh * 0.12);
        const cropX = Math.floor((vw - cropW) / 2);
        const cropY = Math.floor(vh * 0.40 - cropH / 2);

        // OCR用に2.5倍に拡大して鮮明化
        cropCanvas.width = cropW * 2.5;
        cropCanvas.height = cropH * 2.5;
        const ctx = cropCanvas.getContext("2d");

        // 白黒二値化＆輪郭強調
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropCanvas.width, cropCanvas.height);
        binarizeTargetCanvas(ctx, cropCanvas.width, cropCanvas.height);

        const targetDataUrl = cropCanvas.toDataURL("image/jpeg", 0.9);

        if (window.Tesseract) {
          const result = await Tesseract.recognize(targetDataUrl, 'jpn+eng');
          const text = (result.data.text || "").trim();

          if (text) {
            findAndDisplayWordReading(text);
          }
        }
      } catch (err) {
        console.warn("Pinpoint scan note:", err);
      } finally {
        reticle.classList.remove("scanning");
        isOcrProcessing = false;
      }
    }

    function binarizeTargetCanvas(ctx, w, h) {
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        const v = gray > 140 ? 255 : 0;
        d[i] = v; d[i + 1] = v; d[i + 2] = v;
      }
      ctx.putImageData(imgData, 0, 0);
    }

    // ★ 全体ではなく「ピンポイントの漢字・単語」の読み方を表示する！ ★
    async function findAndDisplayWordReading(rawText) {
      // 1. ノイズ記号を除去
      const cleaned = rawText.replace(/[\-_|\\\/~^`'"=;:.,*+?!#%&()<>\[\]{}0-9\s]/g, "");

      // A. 内蔵漢字辞書に一致するかチェック（最高優先度・最も綺麗な読みと意味）
      for (const [kWord, info] of Object.entries(KANJI_DATABASE)) {
        if (cleaned.includes(kWord)) {
          if (lastFoundWord === kWord) return; // 同じ単語なら再表示しない
          lastFoundWord = kWord;
          showPinpointWordPopup({
            type: "kanji",
            word: kWord,
            reading: `【 ${info.reading} 】`,
            meaning: info.meaning,
            voiceText: info.reading,
            voiceLang: "ja-JP"
          });
          return;
        }
      }

      // B. 英語の単語に一致するかチェック
      const engMatch = rawText.match(/[a-zA-Z]{3,}/g);
      if (engMatch && engMatch.length > 0) {
        const engWord = engMatch[0].toLowerCase();
        if (lastFoundWord === engWord) return;
        lastFoundWord = engWord;

        // 内蔵英単語辞書
        if (COMMON_ENGLISH_DICT[engWord]) {
          const eInfo = COMMON_ENGLISH_DICT[engWord];
          showPinpointWordPopup({
            type: "english",
            word: engWord.toUpperCase(),
            reading: `【 ${eInfo.ja} 】`,
            meaning: eInfo.desc,
            voiceText: engWord,
            voiceLang: "en-US"
          });
          return;
        }

        // MyMemory APIで英単語を日本語訳
        try {
          const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(engWord)}&langpair=en|ja`);
          const data = await res.json();
          const jaText = data.responseData ? data.responseData.translatedText : "";
          if (jaText) {
            showPinpointWordPopup({
              type: "english",
              word: engWord.toUpperCase(),
              reading: `【 ${jaText} 】`,
              meaning: `英語の日本語訳です。「音声で聴く」で発音を確認できます。`,
              voiceText: engWord,
              voiceLang: "en-US"
            });
            return;
          }
        } catch (e) {}
      }

      // C. 辞書外だが漢字が検出された場合（漢字の音声読み上げ準備）
      const kanjiMatch = cleaned.match(/[\u4e00-\u9faf]{2,}/);
      if (kanjiMatch) {
        const kWord = kanjiMatch[0];
        if (lastFoundWord === kWord) return;
        lastFoundWord = kWord;
        showPinpointWordPopup({
          type: "kanji",
          word: kWord,
          reading: `【 読み上げ音声を準備完了 】`,
          meaning: `右側の「音声で聴く」を押すと、この漢字の正しい日本語の読み上げ音が流れます！`,
          voiceText: kWord,
          voiceLang: "ja-JP"
        });
        return;
      }
    }

      }
    }

    function extractDateTimeFromText(text) {
      const now = new Date();
      let detectedDate = null;
      let detectedTime = null;

      const ymdRegex = /(?:(\d{4}|令(?:和)?\s*(\d{1,2}))[年\/\.\-])?\s*(\d{1,2})[月\/\.\-](\d{1,2})日?/;
      const matchYmd = text.match(ymdRegex);
      if (matchYmd) {
        let year = now.getFullYear();
        if (matchYmd[1]) {
          if (matchYmd[1].startsWith("令")) {
            const rYear = parseInt(matchYmd[2] || "1", 10);
            year = 2018 + rYear;
          } else {
            year = parseInt(matchYmd[1], 10);
          }
        }
        const month = parseInt(matchYmd[3], 10);
        const day = parseInt(matchYmd[4], 10);
        if (month >= 1 && month <= 12 && day >= 1 && day <= 31) {
          detectedDate = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        }
      }

      const timeRegex = /(?:(午前|午後)\s*)?(\d{1,2})[:時](\d{2})?(?:分)?/;
      const matchTime = text.match(timeRegex);
      if (matchTime) {
        let hour = parseInt(matchTime[2], 10);
        const minute = matchTime[3] ? parseInt(matchTime[3], 10) : 0;
        const ampm = matchTime[1];
        if (ampm === "午後" && hour < 12) hour += 12;
        if (ampm === "午前" && hour === 12) hour = 0;
        if (hour >= 0 && hour <= 23 && minute >= 0 && minute <= 59) {
          detectedTime = `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
        }
      }

      if (detectedDate) {
        document.getElementById("editDate").value = detectedDate;
        document.getElementById("dateDetectedTag").style.display = "inline";
      }
      if (detectedTime) {
        document.getElementById("editTime").value = detectedTime;
        document.getElementById("timeDetectedTag").style.display = "inline";
      }

      const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 2);
      if (lines.length > 0 && !document.getElementById("editTitle").value) {
        document.getElementById("editTitle").value = lines[0].substring(0, 30);
      }
    }

    /* 辞書タブ用 */
    function executeKanjiReading(query) {
      if (!query || !query.trim()) { showToast("漢字を入力してください"); return; }
      const q = query.trim();
      let reading = "";
      let meaning = "";
      for (const [k, v] of Object.entries(KANJI_DATABASE)) {
        if (q.includes(k) || k.includes(q)) {
          reading = v.reading;
          meaning = v.meaning;
          break;
        }
      }
      const descHtml = reading 
        ? `読み方: 【<strong style="color:var(--accent-gold); font-size:1.2rem;">${reading}</strong>】<br>${meaning}`
        : `「音声で聴く」を押すと正しい読み上げ音が流れます。`;

      displayKnowledgeResult("purple", `🈩 漢字の読み方`, `漢字: ${q}`, descHtml, reading || q, "ja-JP", [
        { label: "漢字ペディアで調べる", url: `https://www.kanjipedia.jp/search?k=${encodeURIComponent(q)}` },
        { label: "コトバンクで読み方", url: `https://kotobank.jp/word/${encodeURIComponent(q)}` }
      ]);
      readAloudCurrent();
    }

    async function executeTranslate(query) {
      if (!query || !query.trim()) { showToast("英語を入力してください"); return; }
      const q = query.trim();
      let translated = "";
      for (const [eKey, jVal] of Object.entries(COMMON_ENGLISH_DICT)) {
        if (q.toLowerCase() === eKey) { translated = jVal.ja; break; }
      }
      if (!translated) {
        try {
          const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=en|ja`);
          const data = await res.json();
          translated = data.responseData ? data.responseData.translatedText : "翻訳できませんでした";
        } catch (e) { translated = "外部辞書でご確認ください"; }
      }
      displayKnowledgeResult("blue", `🇺🇸 英語の日本語訳`, `英語: ${q}`, `意味: 【<strong style="color:#93c5fd; font-size:1.2rem;">${translated}</strong>】`, q, "en-US", [
        { label: "Google翻訳で開く", url: `https://translate.google.com/?sl=en&tl=ja&text=${encodeURIComponent(q)}&op=translate` }
      ]);
      readAloudCurrent();
    }

    async function executeWordMeaning(query) {
      if (!query || !query.trim()) { showToast("言葉を入力してください"); return; }
      const q = query.trim();
      let meaning = "";
      for (const [k, v] of Object.entries(KANJI_DATABASE)) {
        if (q.includes(k)) { meaning = `【${v.reading}】${v.meaning}`; break; }
      }
      displayKnowledgeResult("green", `📖 言葉の意味`, `用語: ${q}`, meaning || `辞書リンクよりご確認いただけます。`, q, "ja-JP", [
        { label: "コトバンク国語辞典", url: `https://kotobank.jp/word/${encodeURIComponent(q)}` },
        { label: "goo辞書で調べる", url: `https://dictionary.goo.ne.jp/srch/jn/${encodeURIComponent(q)}/m0u/` }
      ]);
    }

    function displayKnowledgeResult(badgeColor, badgeHtml, mainHtml, subHtml, voiceText, voiceLang, links) {
      const card = document.getElementById("knowledgeResultCard");
      const badge = document.getElementById("resultTypeBadge");
      badge.className = `result-badge ${badgeColor}`;
      badge.innerHTML = badgeHtml;

      document.getElementById("resultMainText").innerHTML = mainHtml;
      document.getElementById("resultSubText").innerHTML = subHtml;

      popupVoiceWord = voiceText;
      popupVoiceLang = voiceLang;

      const linksRow = document.getElementById("externalLinksRow");
      linksRow.innerHTML = (links || []).map(l => `
        <a href="${l.url}" target="_blank" style="font-size:0.75rem; color:#38bdf8; text-decoration:none; background:#1e293b; border:1px solid #334155; padding:5px 9px; border-radius:6px; display:inline-flex; align-items:center; gap:4px;">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> ${l.label}
        </a>
      `).join("");
      card.style.display = "flex";
    }

    function readAloudCurrent() {
      if (!('speechSynthesis' in window)) return;
      if (!popupVoiceWord) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(popupVoiceWord);
      u.lang = popupVoiceLang || "ja-JP";
      u.rate = 0.90;
      window.speechSynthesis.speak(u);
    }

    function clearDictInput() {
      document.getElementById("dictQueryInput").value = "";
      document.getElementById("knowledgeResultCard").style.display = "none";
    }

    /* カレンダーログ */
    async function saveToCalendarLog(closeModal = true) {
      const title = document.getElementById("editTitle").value.trim() || "撮影メモ";
      const date = document.getElementById("editDate").value;
      const time = document.getElementById("editTime").value || "09:00";
      const memo = document.getElementById("editMemo").value.trim();

      const logItem = {
        title: title,
        date: date,
        time: time,
        memo: memo,
        image: capturedDataUrl,
        isRegistered: false,
        createdAt: new Date().toISOString()
      };

      await addLogToDB(logItem);
      showToast("カレンダーログに保存しました！");
      if (closeModal) closeEditSheet();
      loadLogs();
      updateBadge();
    }

    function addLogToDB(item) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(["logs"], "readwrite");
        const store = tx.objectStore("logs");
        const req = store.add(item);
        req.onsuccess = () => resolve(req.result);
        req.onerror = (e) => reject(e);
      });
    }

    function getAllLogs() {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(["logs"], "readonly");
        const store = tx.objectStore("logs");
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = (e) => reject(e);
      });
    }

    function deleteLogFromDB(id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(["logs"], "readwrite");
        const store = tx.objectStore("logs");
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e);
      });
    }

    function updateLogStatusInDB(id, isRegistered) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(["logs"], "readwrite");
        const store = tx.objectStore("logs");
        const getReq = store.get(id);
        getReq.onsuccess = () => {
          const data = getReq.result;
          if (data) {
            data.isRegistered = isRegistered;
            store.put(data);
            resolve();
          }
        };
        getReq.onerror = (e) => reject(e);
      });
    }

    async function loadLogs() {
      const logs = await getAllLogs();
      logs.sort((a, b) => (b.date + " " + b.time).localeCompare(a.date + " " + a.time));

      const logContainer = document.getElementById("calendarLogList");
      const galleryContainer = document.getElementById("galleryList");

      if (logs.length === 0) {
        logContainer.innerHTML = `
          <div class="empty-state">
            <i class="fa-regular fa-calendar-xmark empty-icon"></i>
            <p>カレンダーログはまだありません</p>
          </div>
        `;
        galleryContainer.innerHTML = `
          <div class="empty-state">
            <i class="fa-regular fa-images empty-icon"></i>
            <p>保存された写真メモはありません</p>
          </div>
        `;
        return;
      }

      logContainer.innerHTML = logs.map(item => `
        <div class="log-card ${item.isRegistered ? 'status-registered' : ''}" id="logCard_${item.id}">
          <div class="log-card-header">
            <img src="${item.image}" class="log-thumb" onclick="openImageModal('${item.image}')">
            <div class="log-info">
              <div class="log-date-badge">
                <i class="fa-regular fa-calendar-check"></i> ${formatDisplayDate(item.date, item.time)}
              </div>
              <div class="log-title">${escapeHtml(item.title)}</div>
              <div class="log-memo">${escapeHtml(item.memo || 'メモなし')}</div>
            </div>
          </div>
          <div class="log-card-actions">
            <button class="cal-add-btn" onclick="registerToGoogleCalendar('${encodeURIComponent(JSON.stringify(item))}')">
              <i class="fa-brands fa-google"></i> Googleカレンダーへ
            </button>
            <button class="cal-ics-btn" onclick="downloadIcsFile('${encodeURIComponent(JSON.stringify(item))}')">
              <i class="fa-solid fa-calendar"></i> スマホ本体へ (.ics)
            </button>
            <div class="log-sub-actions">
              <button class="card-icon-btn" onclick="toggleLogRegistered(${item.id}, ${!item.isRegistered})">
                <i class="fa-solid fa-check" style="${item.isRegistered ? 'color:var(--accent-green);font-weight:bold;' : ''}"></i>
              </button>
              <button class="card-icon-btn delete" onclick="deleteLog(${item.id})">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        </div>
      `).join("");

      galleryContainer.innerHTML = logs.map(item => `
        <div class="log-card">
          <div class="log-card-header">
            <img src="${item.image}" class="log-thumb" style="width:85px;height:85px;" onclick="openImageModal('${item.image}')">
            <div class="log-info">
              <div class="log-title">${escapeHtml(item.title)}</div>
              <div style="font-size:0.8rem; color:var(--accent-gold); margin-bottom:4px;">
                <i class="fa-regular fa-clock"></i> ${item.date} ${item.time}
              </div>
              <div class="log-memo">${escapeHtml(item.memo || 'メモなし')}</div>
            </div>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:8px;">
            <a href="${item.image}" download="loupe_${item.date}.jpg" class="card-icon-btn">
              <i class="fa-solid fa-download"></i>
            </a>
            <button class="card-icon-btn delete" onclick="deleteLog(${item.id})">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>
      `).join("");
    }

    async function updateBadge() {
      const logs = await getAllLogs();
      const count = logs.filter(l => !l.isRegistered).length;
      document.getElementById("logBadge").innerText = count;
      document.getElementById("logBadge").style.display = count > 0 ? "inline" : "none";
    }

    async function toggleLogRegistered(id, isReg) {
      await updateLogStatusInDB(id, isReg);
      loadLogs();
      updateBadge();
    }

    async function deleteLog(id) {
      if (!confirm("このログを削除しますか？")) return;
      await deleteLogFromDB(id);
      loadLogs();
      updateBadge();
    }

    function registerToGoogleCalendar(encodedItem) {
      const item = JSON.parse(decodeURIComponent(encodedItem));
      const dtStart = formatGoogleDate(item.date, item.time);
      const dtEnd = formatGoogleDate(item.date, getEndTime(item.time));
      const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(item.title)}&dates=${dtStart}/${dtEnd}&details=${encodeURIComponent(item.memo)}`;
      window.open(url, "_blank");
      updateLogStatusInDB(item.id, true).then(() => { loadLogs(); updateBadge(); });
    }

    function directRegisterGoogle() {
      const title = encodeURIComponent(document.getElementById("editTitle").value.trim() || "撮影メモ");
      const date = document.getElementById("editDate").value;
      const time = document.getElementById("editTime").value || "09:00";
      const memo = encodeURIComponent(document.getElementById("editMemo").value.trim());
      const dtStart = formatGoogleDate(date, time);
      const dtEnd = formatGoogleDate(date, getEndTime(time));
      const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dtStart}/${dtEnd}&details=${memo}`;
      saveToCalendarLog(false);
      window.open(url, "_blank");
      closeEditSheet();
    }

    function downloadIcsFile(encodedItem) {
      const item = JSON.parse(decodeURIComponent(encodedItem));
      generateAndDownloadIcs(item.title, item.date, item.time, item.memo);
      updateLogStatusInDB(item.id, true).then(() => { loadLogs(); updateBadge(); });
    }

    function directDownloadIcs() {
      const title = document.getElementById("editTitle").value.trim() || "撮影メモ";
      const date = document.getElementById("editDate").value;
      const time = document.getElementById("editTime").value || "09:00";
      const memo = document.getElementById("editMemo").value.trim();
      saveToCalendarLog(false);
      generateAndDownloadIcs(title, date, time, memo);
      closeEditSheet();
    }

    function generateAndDownloadIcs(title, dateStr, timeStr, memo) {
      const startIso = formatIcsDate(dateStr, timeStr);
      const endIso = formatIcsDate(dateStr, getEndTime(timeStr));
      const nowIso = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
      const ics = [
        "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Smart Loupe//JP",
        "BEGIN:VEVENT", `UID:${Date.now()}@loupe`, `DTSTAMP:${nowIso}`,
        `DTSTART:${startIso}`, `DTEND:${endIso}`, `SUMMARY:${title}`,
        `DESCRIPTION:${memo.replace(/\n/g, "\\n")}`, "END:VEVENT", "END:VCALENDAR"
      ].join("\r\n");
      const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `event_${dateStr}.ics`;
      link.click();
    }

    function formatGoogleDate(dateStr, timeStr) {
      return (dateStr || "").replace(/-/g, "") + "T" + (timeStr || "09:00").replace(/:/g, "") + "00";
    }
    function formatIcsDate(dateStr, timeStr) {
      return (dateStr || "").replace(/-/g, "") + "T" + (timeStr || "09:00").replace(/:/g, "") + "00";
    }
    function getEndTime(timeStr) {
      if (!timeStr) return "10:00";
      const p = timeStr.split(":");
      let h = Math.min(23, parseInt(p[0], 10) + 1);
      return `${String(h).padStart(2, '0')}:${p[1] || '00'}`;
    }
    function formatDisplayDate(dateStr, timeStr) {
      if (!dateStr) return "日付未設定";
      const parts = dateStr.split("-");
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      const days = ["日", "月", "火", "水", "木", "金", "土"];
      return `${parts[0]}年${parseInt(parts[1], 10)}月${parseInt(parts[2], 10)}日(${days[d.getDay()] || ''}) ${timeStr || ''}`;
    }
    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    function switchTab(tab) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".view-panel").forEach(p => p.classList.remove("active"));

      if (tab === 'loupe') {
        document.getElementById("tabLoupe").classList.add("active");
        document.getElementById("viewLoupe").classList.add("active");
      } else if (tab === 'dictionary') {
        document.getElementById("tabDictionary").classList.add("active");
        document.getElementById("viewDictionary").classList.add("active");
      } else if (tab === 'calendarLog') {
        document.getElementById("tabCalendarLog").classList.add("active");
        document.getElementById("viewCalendarLog").classList.add("active");
        loadLogs();
      } else if (tab === 'gallery') {
        document.getElementById("tabGallery").classList.add("active");
        document.getElementById("viewGallery").classList.add("active");
        loadLogs();
      }
    }

    function openImageModal(src) {
      document.getElementById("imageModalImg").src = src;
      document.getElementById("imageModal").classList.add("active");
    }
    function closeImageModal() {
      document.getElementById("imageModal").classList.remove("active");
    }

    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById("toast");
      document.getElementById("toastMsg").innerText = msg;
      t.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
    }

    function showHelpModal() {
      alert("【カレンダーログの使い方】\n\n1. 「拡大鏡」で予定表やチラシの日付部分を撮影します。\n2. 日付・時間が自動検出され、カレンダーログに保存されます。\n3. 「カレンダーログ」タブから『Googleカレンダーへ』または『スマホ本体へ』を押してワンタップで予定に登録できます！");
    }

    window.addEventListener("DOMContentLoaded", async () => {
      await initDB();
      await startCamera();
      loadLogs();
      updateBadge();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => {});
      }
    });
  </script>
